[project]
name = "perfpilot"
version = "0.1.0"
description = "PerfPilot: find the vLLM commit that slowed serving, tune it back, verified."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "openai>=1.0",
  "modal>=1.0",
]

[project.scripts]
perfpilot = "perfpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfpilot"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"perfpilot/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
