<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfPilot — Architecture</title>
<meta name="theme-color" content="#F7F7F2">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bench:#EEF1F4; --panel:#FFFFFF; --ink:#16202B; --graphite:#5B6878; --rule:#D3D9E0;
    --green:#1F5FBF; --oxide:#C8323C; --ochre:#B26A00; --steel:#1F5FBF; --teal:#6B5BA8;
    --sans:"Schibsted Grotesk", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --serif:var(--sans);
    --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bench); color:var(--ink);
         font:400 1rem/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--green); outline-offset:3px; border-radius:2px; }
  code { font:400 .86em var(--mono); background:transparent; border-bottom:1px solid var(--rule); }

  .page { max-width:1120px; margin:0 auto; padding:0 1.25rem; display:grid;
          grid-template-columns:200px minmax(0,1fr); gap:3rem; }
  .rail { position:sticky; top:0; align-self:start; height:100vh; padding:2.2rem 0;
          display:flex; flex-direction:column; gap:1.6rem; }
  .brand { font:700 1.05rem var(--sans); text-decoration:none; }
  .rail nav { display:flex; flex-direction:column; gap:.15rem; }
  .rail nav a { font-size:.9rem; color:var(--graphite); text-decoration:none; padding:.25rem 0 .25rem .7rem;
                border-left:2px solid transparent; }
  .rail nav a:hover { color:var(--ink); }
  .rail nav a[aria-current="true"] { color:var(--ink); border-left-color:var(--ink); }

  main { min-width:0; padding:2.2rem 0 4rem; }

  .lede-block { padding:1.2rem 0 2.6rem; border-bottom:1px solid var(--rule); }
  h1 { margin:0 0 1.1rem; font:700 clamp(2.2rem,5vw,3.6rem)/1.02 var(--sans); letter-spacing:-.035em;
       max-width:18ch; }
  .lede-block p { margin:0; max-width:60ch; font-size:1.1rem; color:var(--graphite); }
  .facts { display:grid; grid-template-columns:repeat(4,1fr); gap:0 1.4rem;
           margin:2rem 0 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .facts div { border:none; border-radius:0; padding:.9rem 0; background:none; }
  .facts div:not(:first-child) { border-left:1px solid var(--rule); padding-left:1.2rem; }
  .facts dt { font:500 .72rem var(--sans); color:var(--graphite); }
  .facts dd { margin:.15rem 0 0; font:600 1.12rem var(--sans); }

  section { padding:2.8rem 0; border-bottom:1px solid var(--rule); scroll-margin-top:1.5rem; }
  section:last-of-type { border-bottom:0; }
  h2 { margin:0 0 .5rem; font:700 clamp(1.6rem,3vw,2.1rem)/1.1 var(--sans); letter-spacing:-.02em; }
  .intro { margin:0 0 1.6rem; max-width:66ch; color:var(--graphite); }
  p { max-width:68ch; margin:0 0 1rem; }

  figure { margin:0; }
  .svgwrap { overflow-x:auto; background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:.5rem; }
  .svgwrap svg { display:block; width:100%; min-width:640px; height:auto; }
  .key { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; padding:.85rem 0 0; font-size:.82rem; color:var(--graphite); }
  .key span { display:inline-flex; align-items:center; gap:.4rem; }
  .key i { width:.7rem; height:.7rem; border:1.5px solid; border-radius:2px; display:inline-block; }
  .readout { margin-top:.9rem; min-height:3.4em; padding:.6rem 0 0 .9rem; border-left:2px solid var(--ink);
             font-size:.92rem; }
  .readout .none { color:var(--graphite); }
  figcaption { font-size:.88rem; color:var(--graphite); margin-top:.9rem; max-width:72ch; }
  .trace { margin-top:1.2rem; }
  .tracecap { font-size:.88rem; color:var(--graphite); max-width:70ch; }
  .tracecap code { font-family:"IBM Plex Mono",monospace; font-size:.82em; }
  .chips { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.6rem; }
  .chip { font-size:.8rem; border:1px solid var(--rule); border-radius:999px;
          padding:.3rem .75rem; background:var(--panel); }
  .chip b { font-weight:600; margin-right:.25rem; }
  .chip.ok b { color:var(--green); }
  .chip.no { border-color:var(--red); }
  .chip.no b { color:var(--red); }
  .chip.more { border-style:dashed; color:var(--graphite); }

  .node { cursor:default; }
  .node .body { transition:opacity .15s ease; }
  .node:hover .body, .node.active .body { opacity:.82; }

  .notes { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1.2rem 2.2rem; margin-top:2rem; }
  .notes h3 { margin:0 0 .3rem; font:500 .95rem var(--sans); }
  .notes p { margin:0; font-size:.9rem; color:var(--graphite); }

  ol.steps { list-style:none; margin:0; padding:0; counter-reset:s; max-width:70ch; }
  ol.steps li { counter-increment:s; display:grid; grid-template-columns:2.4rem 1fr; padding:.9rem 0;
                border-top:1px solid var(--rule); }
  ol.steps li:last-child { border-bottom:1px solid var(--rule); }
  ol.steps li::before { content:counter(s, decimal-leading-zero); font:400 .9rem var(--mono); color:var(--teal); padding-top:.1rem; }
  ol.steps b { display:block; font-weight:500; }
  ol.steps span { color:var(--graphite); font-size:.95rem; }

  dl.decisions { margin:0; max-width:76ch; }
  dl.decisions div { display:grid; grid-template-columns:minmax(180px,.8fr) 1.2fr; gap:1.2rem 2.2rem;
                     padding:1.1rem 0; border-top:1px solid var(--rule); }
  dl.decisions div:last-child { border-bottom:1px solid var(--rule); }
  dl.decisions dt { font:400 1.35rem/1.25 var(--serif); }
  dl.decisions dd { margin:0; color:var(--graphite); font-size:.96rem; }

  table.status { width:100%; border-collapse:collapse; font-size:.93rem; }
  table.status th { text-align:left; font:400 .8rem var(--mono); color:var(--graphite); padding:.5rem .6rem .5rem 0;
                    border-bottom:1px solid var(--ink); }
  table.status td { padding:.7rem .6rem .7rem 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  table.status td code { font-size:.82rem; }
  .ok { color:var(--green); font-weight:500; } .wait { color:var(--ochre); font-weight:500; }

  footer { padding:2rem 0 3rem; font-size:.85rem; color:var(--graphite); max-width:68ch; }

  @media (max-width:820px) {
    .page { grid-template-columns:1fr; gap:0; }
    .rail { position:static; height:auto; padding:1.2rem 0 0; flex-direction:row; flex-wrap:wrap;
            align-items:center; gap:.4rem 1rem; border-bottom:1px solid var(--rule); }
    .rail nav { flex-direction:row; flex-wrap:wrap; gap:.2rem .9rem; }
    .rail nav a { padding:.2rem 0; border-left:0; border-bottom:2px solid transparent; }
    .rail nav a[aria-current="true"] { border-bottom-color:var(--ink); }
    main { padding-top:1.4rem; }
    dl.decisions div { grid-template-columns:1fr; gap:.4rem; }
    .facts { grid-template-columns:1fr 1fr; }
    .facts div:nth-child(3) { border-left:none; padding-left:0; }
    h2 { font-size:1.75rem; }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    * { transition:none !important; }
  }
  .topnav { position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bench) 88%, transparent);
            backdrop-filter:blur(8px); border-bottom:1px solid var(--rule); }
  .topnav-inner { max-width:1120px; margin:0 auto; padding:.7rem 1.25rem; display:flex; align-items:center; gap:1.5rem; }
  .topnav .brand { display:flex; align-items:center; gap:.55rem; color:var(--ink); }
  .topnav-links { display:flex; gap:.25rem; margin-left:auto; overflow-x:auto; scrollbar-width:none; }
  .topnav-links a { color:var(--graphite); text-decoration:none; font:500 .92rem var(--sans); padding:.4rem .7rem; border-radius:6px; white-space:nowrap; }
  .topnav-links a:hover { color:var(--ink); background:var(--panel); }
  .topnav-links a[aria-current="page"] { color:var(--ink); background:var(--panel); box-shadow:inset 0 0 0 1px var(--rule); }
  .topnav-links a.gh { color:var(--panel); background:var(--ink); }
  .rail { top:3.4rem !important; height:calc(100vh - 3.4rem) !important; }
  .rail .brand { display:none !important; }
  section { scroll-margin-top:4.5rem !important; }
  @media (max-width:640px) { .topnav .brand span { display:none; } }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="26" height="26"><span>PerfPilot</span></a>
    <nav class="topnav-links" aria-label="Site">
      <a href="index.html#how">How it works</a>
      <a href="index.html#evidence">GPU evidence</a>
      <a href="index.html#bench">Bench and swarm</a>
      <a href="index.html#reports">Run reports</a>
      <a href="architecture.html" aria-current="page">Architecture</a>
      <a class="gh" href="https://github.com/bharath03-a/perfpilot">GitHub</a>
    </nav>
  </div>
</header>
<div id="root"></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------- palette by role ---------- */
const TONE = {
  blue:  { stroke: "#1F5FBF", fill: "#E3ECF8" },   // decide
  teal:  { stroke: "#6B5BA8", fill: "#F3F0FA" },   // advise (brain)
  green: { stroke: "#1E7A52", fill: "#E2F2EA" },   // prove (verdicts)
  red:   { stroke: "#C8323C", fill: "#FBE7E8" },   // spend (GPU)
  amber: { stroke: "#B26A00", fill: "#FDF1E0" },   // bounded salvage
  slate: { stroke: "#5B6878", fill: "#FFFFFF" },   // ground / decision
  navy:  { stroke: "#16202B", fill: "#16202B" },
};

function Node({ n, active, onHover }) {
  const t = TONE[n.tone];
  const cx = n.x + n.w / 2;
  return (
    <g className={"node" + (active ? " active" : "")} tabIndex={0}
       onMouseEnter={() => onHover(n)} onMouseLeave={() => onHover(null)}
       onFocus={() => onHover(n)} onBlur={() => onHover(null)}>
      <rect className="body" x={n.x} y={n.y} width={n.w} height={n.h} rx="6"
            fill={n.solid ? t.stroke : t.fill} stroke={t.stroke} strokeWidth={n.solid ? 0 : 1.4} />
      <text x={cx} y={n.y + 22} textAnchor="middle" fontSize="13" fontWeight="500"
            fontFamily="Schibsted Grotesk, sans-serif" fill={n.solid ? "#fff" : "#292929"}>{n.title}</text>
      {(n.lines || []).map((L, i) => (
        <text key={i} x={cx} y={n.y + 39 + i * 15} textAnchor="middle" fontSize="10.5"
              fontFamily="JetBrains Mono, monospace" fill={n.solid ? "#F2F2EC" : "#72726E"}>{L}</text>
      ))}
    </g>
  );
}

function Diamond({ n, active, onHover }) {
  const t = TONE[n.tone];
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  return (
    <g className={"node" + (active ? " active" : "")} tabIndex={0}
       onMouseEnter={() => onHover(n)} onMouseLeave={() => onHover(null)}
       onFocus={() => onHover(n)} onBlur={() => onHover(null)}>
      <polygon className="body" points={`${cx},${n.y} ${n.x + n.w},${cy} ${cx},${n.y + n.h} ${n.x},${cy}`}
               fill={t.fill} stroke={t.stroke} strokeWidth="1.4" />
      <text x={cx} y={cy + 4} textAnchor="middle" fontSize="11.5" fontWeight="500"
            fontFamily="Schibsted Grotesk, sans-serif" fill="#292929">{n.title}</text>
    </g>
  );
}

function Edge({ d, label, lx, ly, color, dashed, bold, id }) {
  const c = color || "#72726E";
  return (
    <g>
      <path d={d} fill="none" stroke={c} strokeWidth={bold ? 2 : 1.3}
            strokeDasharray={dashed ? "5,4" : ""} markerEnd={`url(#${id})`} />
      {label && <text x={lx} y={ly} textAnchor="middle" fontSize="10.5" fontWeight={bold ? "500" : "400"}
                      fontFamily="JetBrains Mono, monospace" fill={c}>{label}</text>}
    </g>
  );
}

function Badge({ x, y, n }) {
  return (
    <g>
      <circle cx={x} cy={y} r="10" fill="#292929" stroke="#FFFFFF" strokeWidth="1.5" />
      <text x={x} y={y + 3.8} textAnchor="middle" fontSize="10.5" fontWeight="500"
            fontFamily="JetBrains Mono, monospace" fill="#FFFFFF">{n}</text>
    </g>
  );
}

function Key({ items }) {
  return (
    <div className="key">
      {items.map(([tone, label]) => (
        <span key={label}><i style={{ background: TONE[tone].fill, borderColor: TONE[tone].stroke }} />{label}</span>
      ))}
    </div>
  );
}

function Readout({ node }) {
  if (!node) return <div className="readout"><span className="none">Hover or focus a box to read what it does.</span></div>;
  return <div className="readout" aria-live="polite"><b style={{ fontWeight: 500 }}>{node.title}. </b>{node.desc}</div>;
}

const marker = (id, color) => (
  <marker id={id} markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7" fill="none" stroke={color} strokeWidth="1.4" />
  </marker>
);

/* ---------- navigation ---------- */
const SECTIONS = [
  ["planes", "Planes"], ["modules", "Modules"], ["bisect", "Bisect"],
  ["tune", "TuneSmith"], ["agent", "Agentic loop"], ["swarm", "Swarm + bench"], ["decisions", "Decisions"], ["status", "Status"],
];

function Rail({ active }) {
  return (
    <aside className="rail">
      <a className="brand" href="index.html" style={{display:"flex",alignItems:"center",gap:".55rem"}}><img src="assets/logo.svg" alt="" width="26" height="26" />PerfPilot</a>
      <nav aria-label="Sections">
        {SECTIONS.map(([id, label]) => (
          <a key={id} href={"#" + id} aria-current={active === id ? "true" : undefined}>{label}</a>
        ))}
      </nav>
    </aside>
  );
}

/* ---------- 01 · planes ---------- */
const HIGH_NODES = [
  { id: "cli", x: 30, y: 80, w: 200, h: 120, tone: "blue", title: "CLI + Drivers",
    lines: ["bisect · tune · eval", "loops · events · report"],
    desc: "Typer commands and driver loops (cli.py, modes/). They decide what to run, call the brain and stats, and write events.jsonl. Costs nothing." },
  { id: "brain", x: 268, y: 80, w: 200, h: 120, tone: "teal", title: "Brain (Baseten)",
    lines: ["pick · extra runs · rank · propose", "validated JSON · fallback"],
    desc: "muse-spark-open proposes commits, run counts, knob order and one-knob changes. Output is schema-validated with one retry. Out-of-range answers are rejected and replaced by a deterministic fallback, including when no key is set." },
  { id: "stats", x: 506, y: 80, w: 200, h: 120, tone: "green", title: "Stats + Reports",
    lines: ["log-ratio Welch interval", "events.jsonl → report.html"],
    desc: "stats.py turns samples into verdicts (confirm, classify at m = R/2, tune_accepts). Guards: improvements are not regressions, non-finite samples raise, zero-variance intervals never decide. render.py builds the report from the merged event log." },
  { id: "cfg", x: 744, y: 80, w: 186, h: 120, tone: "slate", title: "Config + Git",
    lines: ["perfpilot.yaml · .env", "GitHub compare · wheels"],
    desc: "Model, workload, knobs and stats caps. Bisect ranges come from the GitHub compare API. Eval anchors a 16-commit range to the newest wheeled nightly. Secrets come from env only." },
  { id: "trial", x: 30, y: 300, w: 275, h: 105, tone: "red", title: "Worker.run_trial",
    lines: ["venv per SHA · vLLM serve · warmup", "N bench runs → TrialResult"],
    desc: "One warm A100-40GB container (max_containers=1) serves every trial of a run. The GPU UUID is re-checked per trial; a change is an error, never a comparison. Returns ok, skip or error with per-run tok/s and p99 TTFT." },
  { id: "qual", x: 343, y: 300, w: 275, h: 105, tone: "red", title: "Worker.answer_batch",
    lines: ["50Q bank · greedy · 32 tokens", "tune only: accuracy gate"],
    desc: "Answers the fixed 50-question bank for the baseline, for numeric knobs (kv_cache_dtype), and for the final config. A drop of more than 2 points rejects the change." },
  { id: "cache", x: 656, y: 300, w: 274, h: 105, tone: "red", title: "Modal Volume /cache",
    lines: ["envs/<sha> · toolchain · hf", "venvs · nvcc + ninja · weights"],
    desc: "The perfpilot-cache volume holds per-SHA venvs (reused when the installed SHA matches), one shared nvcc+ninja toolchain, and HF weights. Repeat trials skip the install." },
];

function Planes() {
  const [hover, setHover] = useState(null);
  return (
    <figure>
      <div className="svgwrap">
        <svg viewBox="0 0 960 440" role="img" aria-label="Control plane runs locally and decides. Measurement plane runs on Modal A100 and spends money.">
          <defs>{marker("ha", "#72726E")}{marker("haR", "#C8323C")}</defs>
          <text x="30" y="30" fontSize="10.5" fontFamily="JetBrains Mono, monospace" fill="#1F5FBF">control plane · local · $0</text>
          <rect x="10" y="40" width="940" height="180" rx="6" fill="#F2F2EC" stroke="#1F5FBF" strokeWidth="1" />
          <text x="430" y="292" fontSize="10.5" fontFamily="JetBrains Mono, monospace" fill="#C8323C">measurement plane · Modal A100 · $2.10/h</text>
          <rect x="10" y="272" width="940" height="152" rx="6" fill="#FBF3F3" stroke="#C8323C" strokeWidth="1" />
          {HIGH_NODES.map(n => <Node key={n.id} n={n} active={hover && hover.id === n.id} onHover={setHover} />)}
          <Edge id="ha" d="M230,140 L260,140" label="ask" lx={243} ly={154} />
          <Edge id="ha" d="M130,80 L130,56 L606,56 L606,76" label="samples → verdict · events → report" lx={368} ly={48} />
          <Edge id="ha" d="M837,200 L837,212 L190,212 L190,204" label="config · commits" lx={770} ly={214} />
          <Edge id="haR" color="#C8323C" bold d="M90,224 L90,296" label="run_trial $$$" lx={90} ly={238} />
          <Edge id="haR" color="#C8323C" dashed d="M170,296 L170,228" label="TrialResult" lx={170} ly={260} />
          <Edge id="haR" color="#C8323C" bold d="M222,222 L400,296" label="answer_batch $$$" lx={342} ly={248} />
        </svg>
      </div>
      <Key items={[["blue", "decide"], ["teal", "advise"], ["green", "prove"], ["red", "spend"], ["slate", "ground"]]} />
      <Readout node={hover} />
      <figcaption>The control plane decides and proves. The brain only advises. The two red arrows into the
      worker are the only calls that spend money.</figcaption>
    </figure>
  );
}

/* ---------- 02 · modules ---------- */
const DETAIL_ROWS = [
  { label: "Inputs", boxes: [
    { id: "yaml", x: 10, y: 30, w: 232, h: 76, tone: "slate", title: "perfpilot.yaml",
      lines: ["model · workload · stats · knobs"],
      desc: "config.py pydantic models: model id, bench workload, min and max runs with confidence, bisect repo and endpoints, tune knob grid and quality limit." },
    { id: "env", x: 258, y: 30, w: 232, h: 76, tone: "slate", title: ".env (gitignored)",
      lines: ["PERFPILOT_LLM_API_KEY", "or BASETEN_API_KEY"],
      desc: "The brain key. .env fills gaps only; a real env var always wins. The value is never printed or logged. HF_TOKEN lives in the Modal secret 'huggingface'." },
    { id: "args", x: 506, y: 30, w: 232, h: 76, tone: "slate", title: "CLI args",
      lines: ["--good --bad --commit", "--trials --config"],
      desc: "Per-invocation range or base commit. Config values are the defaults. A missing model or range fails loudly with exit 2." },
    { id: "wheels", x: 754, y: 30, w: 236, h: 76, tone: "slate", title: "wheels + GitHub",
      lines: ["wheels.vllm.ai/<sha> per commit", "compare API · nightly anchor"],
      desc: "Per-SHA nightly wheels. A cached venv is rebuilt when its installed SHA differs. GitHub compare gives the bisect range; eval uses wheeled_range (newest nightly)." },
  ]},
  { label: "CLI · cli.py", boxes: [
    { id: "cmds", x: 10, y: 150, w: 980, h: 72, tone: "blue", title: "bisect · tune · eval · report · watch · demo",
      lines: ["_load · _deployed_worker · _make_orchestrator (AgentOrchestrator, or None → deterministic fallbacks)"],
      desc: "Thin wiring. Loads config, looks up the deployed Modal Worker, builds the orchestrator when a key exists, and hands measure and quality callbacks to the drivers." },
  ]},
  { label: "Orchestration · modes/driver.py · bisect.py · tune.py · orchestrator.py", boxes: [
    { id: "dbis", x: 10, y: 266, w: 318, h: 88, tone: "blue", title: "drive_bisect_live · drive_eval_trial",
      lines: ["run_bisect loop · events · report", "eval: planted culprit · retry-once", "out: culprit / range + verify"],
      desc: "Wrap run_bisect with a run dir, events and report. Failed-request runs are excluded from samples; a GPU UUID change aborts the run. Verdict and culprit events feed the timeline and verdict card. The live driver also fetches the culprit diff and asks the brain to explain it. The eval driver plants an injected slowdown and retries a failed trial once." },
    { id: "dtun", x: 341, y: 266, w: 318, h: 88, tone: "blue", title: "drive_tune_live",
      lines: ["one knob → measure → tune_accepts", "quality gate on numeric knobs", "out: best flags + serve_command"],
      desc: "Wraps run_tuning. One-knob changes on the best config are accepted only above +2% with p99 TTFT at most 10% worse. Numeric knobs and the final config must pass the quality gate. A tune_result event records best/confirmed/serve_command; with no winner the report says Baseline kept." },
    { id: "adap", x: 672, y: 266, w: 318, h: 88, tone: "teal", title: "make_pick_fn · extra_runs_fn · propose_fn",
      lines: ["AgentOrchestrator → driver callbacks", "fallback: middle · 2 runs · next untried"],
      desc: "Adapters from validated brain decisions to plain values. Every call logs an agent_call event. Rejected proposals return the deterministic fallback." },
  ]},
  { label: "Intelligence · agent/ + stats.py", boxes: [

            <b>{i + 1}</b> {kind} · {what} {ok ? "✓" : "✗"}
          </span>
        ))}
        <span className="chip more" title="8 more calls in agent-events.jsonl">+ 8 more</span>
      </div>
    </div>
  );
}

function useActiveSection() {
  const [active, setActive] = useState("planes");
  useEffect(() => {
    const onScroll = () => {
      let cur = "planes";
      for (const [id] of SECTIONS) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 160) cur = id;
      }
      setActive(cur);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return active;
}
